[package]
# The repository and the registry disagreed about this: upstream's manifest
# says `exif` while the crate is published as `kamadak-exif`, with the library
# still importable as `exif`. Cargo matches a `[patch.crates-io]` entry on the
# PACKAGE name, so a consumer could not patch this fork in at all -- the patch
# resolved to a package named `exif` and was silently dropped from the graph
# ("patch ... was not used"), which builds fine against upstream and looks like
# the fork simply having no effect.
name = "kamadak-exif"
version = "0.6.1"
authors = ["KAMADA Ken'ichi <kamada@nanohz.org>"]
edition = "2021"
rust-version = "1.60"

description = "Exif parsing library written in pure Rust"
documentation = "https://docs.rs/kamadak-exif"
homepage = "https://github.com/kamadak/exif-rs"
repository = "https://github.com/kamadak/exif-rs"
readme = "README"
keywords = ["Exif", "JPEG", "parser", "reader", "TIFF"]
categories = ["multimedia::encoding", "multimedia::images", "parser-implementations"]
license = "BSD-2-Clause"

# Keeps `use exif::...` working for every consumer and for this crate's own
# examples and tests, exactly as the published crate does.
[lib]
name = "exif"

[features]
default = []
make_note = ["dep:strum"]
mpf = []

[dependencies]
mutate_once = "0.1.1"
strum = { version = "0.27", features = ["derive"], optional = true }
